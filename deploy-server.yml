---
- name: Deploy server stack
  hosts: all
  become: true

  pre_tasks:
    - name: Assert firewall_backend is valid
      ansible.builtin.assert:
        that:
          - firewall_backend is defined
          - firewall_backend in ['firewalld', 'ufw']
        fail_msg: "firewall_backend must be set to either 'firewalld' or 'ufw'"
      when: deploy_firewall | bool

    - name: Gather installed package facts (firewall detection)
      ansible.builtin.package_facts:
        manager: apt
      when: deploy_firewall | bool

    - name: Set the conflicting backend name for the error message
      ansible.builtin.set_fact:
        firewall_conflicting_backend: "{{ (firewall_backend == 'firewalld') | ternary('ufw', 'firewalld') }}"
      when: deploy_firewall | bool

    - name: Fail if a conflicting firewall backend is already present
      ansible.builtin.fail:
        msg: >-
          firewall_backend is set to "{{ firewall_backend }}", but
          "{{ firewall_conflicting_backend }}" is already installed on this
          host. Installing and configuring both firewalls at once leads to
          conflicting rules, so this run is stopping. Either set
          firewall_backend to "{{ firewall_conflicting_backend }}" in
          group_vars/all/main.yml to match what's already there, or
          remove/purge "{{ firewall_conflicting_backend }}" from the host
          before re-running with firewall_backend: {{ firewall_backend }}.
      when:
        - deploy_firewall | bool
        - (firewall_backend == 'firewalld' and 'ufw' in ansible_facts.packages) or
          (firewall_backend == 'ufw' and 'firewalld' in ansible_facts.packages)

    - name: Assert ssh variables
      ansible.builtin.assert:
        that:
          - ssh_allow_firewall is defined
        fail_msg: "deploy_ssh is enabled but ssh_allow_firewall is not defined"
      when: deploy_ssh | bool

    - name: Assert nginx variables
      ansible.builtin.assert:
        that:
          - nginx_domain is defined and nginx_domain | length > 0
        fail_msg: "deploy_nginx is enabled but nginx_domain is not defined"
      when: deploy_nginx | bool

    # mDNS names are only ever resolvable as "<name>.local" — if
    # nginx_install_avahi is on but nginx_domain doesn't end in .local,
    # avahi will happily start and publish something, but nginx_domain
    # itself will never resolve via mDNS and the mismatch is easy to miss.
    - name: Assert nginx_domain is a .local name when avahi is enabled
      ansible.builtin.assert:
        that:
          - nginx_domain is regex('\\.local$')
        fail_msg: >-
          nginx_install_avahi is true but nginx_domain
          ("{{ nginx_domain }}") does not end in ".local" — mDNS can only
          resolve ".local" names, so set nginx_domain to something like
          "filesrv.local" or turn nginx_install_avahi off.
      when:
        - deploy_nginx | bool
        - nginx_install_avahi | bool

    - name: Assert grafana variables
      ansible.builtin.assert:
        that:
          - grafana_user is defined
          - grafana_password is defined
          - grafana_domain is defined
        fail_msg: "deploy_grafana is enabled but required grafana_* vars are missing"
      when: deploy_grafana | bool

    - name: Assert portainer variables
      ansible.builtin.assert:
        that:
          - portainer_password is defined
          - portainer_domain is defined
        fail_msg: "deploy_portainer is enabled but required portainer_* vars are missing"
      when: deploy_portainer | bool

    - name: Assert filebrowser variables
      ansible.builtin.assert:
        that:
          - filebrowser_user is defined
          - filebrowser_password is defined
          - filebrowser_domain is defined
        fail_msg: "deploy_filebrowser is enabled but required filebrowser_* vars are missing"
      when: deploy_filebrowser | bool

    # Mirrors the "warn but don't fail" behaviour of deploy-server.sh when an
    # nginx proxy is enabled for a backend that this run does not deploy.
    - name: Warn about dangling nginx proxy toggles
      ansible.builtin.debug:
        msg: >-
          Warning: nginx_{{ item }}_proxy is enabled but deploy_{{ item }}
          is disabled — that proxy location will point to a service not
          deployed by this run.
      loop:
        - grafana
        - portainer
        - filebrowser
      when:
        - deploy_nginx | bool
        - lookup('vars', 'nginx_' + item + '_proxy') | bool
        - not (lookup('vars', 'deploy_' + item) | bool)

  roles:
    - role: firewalld
      when: deploy_firewall | bool and firewall_backend == 'firewalld'
      tags: [firewall, firewalld]

    - role: ufw
      when: deploy_firewall | bool and firewall_backend == 'ufw'
      tags: [firewall, ufw]

    - role: ssh
      when: deploy_ssh | bool
      tags: [ssh]

    - role: fail2ban
      when: deploy_fail2ban | bool
      tags: [fail2ban]

    - role: nginx
      when: deploy_nginx | bool
      tags: [nginx]

    - role: grafana
      when: deploy_grafana | bool
      tags: [grafana]

    - role: portainer
      when: deploy_portainer | bool
      tags: [portainer]

    - role: filebrowser
      when: deploy_filebrowser | bool
      tags: [filebrowser]
