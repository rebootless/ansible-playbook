---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Get ufw status
  ansible.builtin.command: ufw status verbose
  register: ufw_status
  changed_when: false

- name: Show summary
  ansible.builtin.debug:
    msg:
      - "UFW:              active"
      - "Default incoming: deny"
      - "Default outgoing: allow"
      - "Status:"
      - "{{ ufw_status.stdout_lines }}"
