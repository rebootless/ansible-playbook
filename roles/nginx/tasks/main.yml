---
- name: Install nginx
  ansible.builtin.apt:
    name:
      - nginx
      - ca-certificates
    state: present
    update_cache: true

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Install avahi-daemon (mDNS / .local hostname)
  ansible.builtin.apt:
    name: avahi-daemon
    state: present
  when: nginx_install_avahi | bool

# By default avahi-daemon advertises the machine's *system* hostname
# (hostnamectl) as "<system-hostname>.local" — it has no idea nginx_domain
# even exists. So if nginx_domain is e.g. "filesrv.local" but the server's
# actual hostname is "debian" or "deb-server", avahi keeps publishing
# "debian.local"/"deb-server.local" and "filesrv.local" never resolves on
# the LAN, even though avahi-daemon is installed and running.
# Setting host-name= under [server] in avahi-daemon.conf overrides that,
# independent of the real system hostname.
# no_extra_spaces is required here: avahi's own config parser does NOT
# trim whitespace around the key name, so ini_file's default "key = value"
# formatting produces a literal key of "host-name " (trailing space), which
# avahi rejects outright with "Invalid configuration key" and refuses to
# start. "key=value" with no spaces is the only form it accepts.
- name: Set avahi-daemon host-name to match nginx_domain
  community.general.ini_file:
    path: /etc/avahi/avahi-daemon.conf
    section: server
    option: host-name
    value: "{{ nginx_domain | regex_replace('\\.local$', '') }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: nginx_install_avahi | bool
  notify: restart avahi-daemon

- name: Enable avahi-daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started
  when: nginx_install_avahi | bool

- name: Install PHP and PHP-FPM
  ansible.builtin.apt:
    name:
      - php-cli
      - php-fpm
      - php-common
      - php-mbstring
      - php-xml
      - php-curl
    state: present
  when: nginx_install_php | bool

- name: Detect installed PHP version
  ansible.builtin.command: php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;'
  register: php_version_result
  changed_when: false
  when: nginx_install_php | bool

- name: Set php_version fact
  ansible.builtin.set_fact:
    php_version: "{{ php_version_result.stdout }}"
  when: nginx_install_php | bool

# Docker is only required if we are wiring up a reverse proxy to a
# Docker-based backend (Grafana / Portainer / File Browser).
- name: Ensure Docker is installed for reverse-proxied backends
  ansible.builtin.include_role:
    name: docker
  when: (nginx_grafana_proxy or nginx_portainer_proxy or nginx_filebrowser_proxy) | bool

# nginx no longer installs a firewall itself — that's the job of the
# firewalld/ufw role (deploy_firewall). Here we only detect whichever
# backend is already present and active, and open our ports on it.
- name: Check whether firewall-cmd is available
  ansible.builtin.command: which firewall-cmd
  register: nginx_firewalld_present
  changed_when: false
  failed_when: false
  when: nginx_configure_firewall | bool

- name: Check whether firewalld is active
  ansible.builtin.command: systemctl is-active firewalld
  register: nginx_firewalld_active
  changed_when: false
  failed_when: false
  when:
    - nginx_configure_firewall | bool
    - nginx_firewalld_present.rc == 0

- name: Check whether ufw is available
  ansible.builtin.command: which ufw
  register: nginx_ufw_present
  changed_when: false
  failed_when: false
  when: nginx_configure_firewall | bool

- name: Check whether ufw is active
  ansible.builtin.command: ufw status
  register: nginx_ufw_active
  changed_when: false
  failed_when: false
  when:
    - nginx_configure_firewall | bool
    - nginx_ufw_present.rc == 0

- name: Allow http/https/mdns through firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - https
    - mdns
  when:
    - nginx_configure_firewall | bool
    - nginx_firewalld_present.rc == 0
    - nginx_firewalld_active.stdout is defined
    - nginx_firewalld_active.stdout == "active"
  register: nginx_firewalld_result

- name: Allow http/https through ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"
  when:
    - nginx_configure_firewall | bool
    - nginx_ufw_present.rc == 0
    - nginx_ufw_active.stdout is defined
    - "'Status: active' in nginx_ufw_active.stdout"
  register: nginx_ufw_http_result

- name: Allow mDNS through ufw
  community.general.ufw:
    rule: allow
    port: "5353"
    proto: udp
  when:
    - nginx_configure_firewall | bool
    - nginx_ufw_present.rc == 0
    - nginx_ufw_active.stdout is defined
    - "'Status: active' in nginx_ufw_active.stdout"
  register: nginx_ufw_mdns_result

- name: Create web root
  ansible.builtin.file:
    path: "/var/www/{{ nginx_domain }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

# Ansible only rewrites the file when its content actually differs, and
# keeps a timestamped .XXXX@ backup — this replaces the manual
# "overwrite? y/N" + mv-to-.bak prompt from deploy-nginx.sh.
- name: Deploy default index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: "/var/www/{{ nginx_domain }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true

- name: Deploy nginx site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_domain }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Enable site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_domain }}"
    state: link
  notify: reload nginx

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush handlers so nginx is reloaded before the summary
  ansible.builtin.meta: flush_handlers

- name: Show summary
  ansible.builtin.debug:
    msg:
      - "Domain:             {{ nginx_domain }}"
      - "Site root:          /var/www/{{ nginx_domain }}"
      - "Config:             /etc/nginx/sites-available/{{ nginx_domain }}"
      - "PHP-FPM:            {{ nginx_install_php }}{{ (' (' + php_version + ')') if (nginx_install_php | bool) else '' }}"
      - "Grafana proxy:      {{ nginx_grafana_proxy }}"
      - "Portainer proxy:    {{ nginx_portainer_proxy }}"
      - "File Browser proxy: {{ nginx_filebrowser_proxy }}"
      - >-
        Firewall (firewalld): {{ 'http, https, mdns allowed' if (nginx_firewalld_result is defined and nginx_firewalld_result is changed)
        else ('available, not touched' if (nginx_configure_firewall | bool and nginx_firewalld_present.rc == 0) else 'not configured / not installed') }}
      - >-
        Firewall (ufw): {{ 'http, https, mdns allowed' if ((nginx_ufw_http_result is defined and nginx_ufw_http_result is changed) or (nginx_ufw_mdns_result is defined and nginx_ufw_mdns_result is changed))
        else ('available, not touched' if (nginx_configure_firewall | bool and nginx_ufw_present.rc == 0) else 'not configured / not installed') }}
