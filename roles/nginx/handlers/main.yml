---
- name: reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

# A plain "systemctl restart avahi-daemon" is unreliable on Debian/Ubuntu:
# avahi-daemon is both unit-activated (avahi-daemon.service) and
# socket-activated (avahi-daemon.socket), and restarting the service alone
# can race with the socket-activated instance still holding
# /run/avahi-daemon/pid — the new process then refuses to start with
# "Daemon already running" and the restart fails with a generic
# "control process exited with error code". Stopping both units, clearing
# the stale pid file, then starting both back up avoids that race.
- name: restart avahi-daemon
  listen: restart avahi-daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - avahi-daemon.socket
    - avahi-daemon.service
  ignore_errors: true

- name: Remove stale avahi-daemon pid file
  listen: restart avahi-daemon
  ansible.builtin.file:
    path: /run/avahi-daemon/pid
    state: absent

- name: Start avahi-daemon back up
  listen: restart avahi-daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - avahi-daemon.socket
    - avahi-daemon.service
