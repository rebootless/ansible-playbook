---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Deploy jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Validate fail2ban configuration
  ansible.builtin.command: fail2ban-client -t
  changed_when: false

- name: Enable fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Flush handlers so the jail config is active before we check status
  ansible.builtin.meta: flush_handlers

- name: Wait for fail2ban socket
  ansible.builtin.wait_for:
    path: /run/fail2ban/fail2ban.sock
    state: present
    timeout: 10

- name: Wait for fail2ban to respond to ping
  ansible.builtin.command: fail2ban-client ping
  register: f2b_ping
  until: f2b_ping.rc == 0
  retries: 25
  delay: 0.2
  changed_when: false

- name: Get jail status
  ansible.builtin.command: fail2ban-client status
  register: f2b_status
  changed_when: false

- name: Show summary
  ansible.builtin.debug:
    msg: "{{ f2b_status.stdout_lines }}"
