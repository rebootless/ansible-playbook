---
- name: Check for an existing compose file
  ansible.builtin.stat:
    path: "{{ grafana_deploy_dir }}/compose.yaml"
  register: grafana_existing_compose

- name: Wipe existing Grafana stack and all data
  when: grafana_wipe_existing | bool
  block:
    - name: Stop and remove existing stack
      community.docker.docker_compose_v2:
        project_src: "{{ grafana_deploy_dir }}"
        state: absent
        remove_volumes: true
      when: grafana_existing_compose.stat.exists
      failed_when: false

    - name: Remove deploy directory
      ansible.builtin.file:
        path: "{{ grafana_deploy_dir }}"
        state: absent

- name: Create directory structure
  ansible.builtin.file:
    path: "{{ grafana_deploy_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - grafana/data
    - grafana/provisioning/dashboards
    - grafana/provisioning/datasources
    - grafana/dashboards
    - prometheus/data
    - secrets

- name: Set Grafana data directory ownership (grafana container UID 472)
  ansible.builtin.file:
    path: "{{ grafana_deploy_dir }}/grafana/data"
    state: directory
    owner: "472"
    group: "472"
    recurse: true
    mode: "0755"

- name: Set Prometheus data directory ownership (nobody UID 65534)
  ansible.builtin.file:
    path: "{{ grafana_deploy_dir }}/prometheus/data"
    state: directory
    owner: "65534"
    group: "65534"
    recurse: true
    mode: "0777"

- name: Write Grafana admin password secret
  ansible.builtin.copy:
    content: "{{ grafana_password }}"
    dest: "{{ grafana_deploy_dir }}/secrets/grafana_admin_password.txt"
    # compose.yaml.j2 bind-mounts this file into the container (not a Swarm
    # secret, so it keeps the host file's ownership/mode as-is). grafana-server
    # runs as UID/GID 472 inside the container, not root — if this file stays
    # root:root it can't read it, GF_SECURITY_ADMIN_PASSWORD__FILE silently
    # fails to resolve, and Grafana falls back to the built-in admin/admin
    # default (which also seems to drop GF_SECURITY_ADMIN_USER in the process).
    owner: "472"
    group: "472"
    mode: "0400"
  no_log: true

- name: Determine Grafana root URL
  ansible.builtin.set_fact:
    grafana_root_url: "{{ ('https://' + grafana_domain + '/grafana/') if grafana_domain else 'http://localhost:3000/' }}"
    grafana_serve_sub_path: "{{ 'true' if grafana_domain else 'false' }}"

- name: Deploy prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ grafana_deploy_dir }}/prometheus/prometheus.yml"
    mode: "0644"
  notify: restart grafana stack

- name: Deploy Grafana datasource provisioning
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ grafana_deploy_dir }}/grafana/provisioning/datasources/prometheus.yml"
    mode: "0644"
  notify: restart grafana stack

- name: Deploy Grafana dashboard provisioning
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ grafana_deploy_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    mode: "0644"
  notify: restart grafana stack

- name: Deploy compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ grafana_deploy_dir }}/compose.yaml"
    mode: "0644"
  notify: restart grafana stack

- name: Flush handlers so config changes are applied before we (re)start
  ansible.builtin.meta: flush_handlers

- name: Start Grafana stack
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_deploy_dir }}"
    state: present
    pull: always

- name: Wait for Grafana health
  ansible.builtin.uri:
    url: "http://localhost:3000/api/health"
    status_code: 200
  register: grafana_health
  until: grafana_health.json is defined and grafana_health.json.database is defined and grafana_health.json.database == "ok"
  retries: 30
  delay: 10
  ignore_errors: true

# GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD__FILE are only honored
# by Grafana the first time it creates grafana.db. On every later deploy the
# database already exists, so those env vars are silently ignored and the
# original admin account (default admin/admin on a fresh install) stays in
# place forever. This block detects that stale default account and fixes it
# via the API, without touching ./grafana/data (dashboards, users, etc.).
- name: Reset Grafana admin credentials if still at the default admin/admin
  when: grafana_health is succeeded
  block:
    - name: Check whether the default admin/admin login still works
      ansible.builtin.uri:
        url: "http://localhost:3000/api/user"
        method: GET
        user: admin
        password: admin
        force_basic_auth: true
        status_code: [200, 401]
      register: grafana_default_login_check
      failed_when: false
      no_log: true

    - name: Apply configured admin username and password
      when:
        - grafana_default_login_check.status is defined
        - grafana_default_login_check.status == 200
      no_log: true
      block:
        - name: Update admin username (login) via Grafana API
          ansible.builtin.uri:
            url: "http://localhost:3000/api/users/1"
            method: PUT
            user: admin
            password: admin
            force_basic_auth: true
            body_format: json
            body:
              login: "{{ grafana_user }}"
              email: "{{ grafana_user }}@localhost"
            status_code: 200
          failed_when: false

        - name: Update admin password via Grafana API
          ansible.builtin.uri:
            url: "http://localhost:3000/api/admin/users/1/password"
            method: PUT
            user: admin
            password: admin
            force_basic_auth: true
            body_format: json
            body:
              password: "{{ grafana_password }}"
            status_code: 200
          failed_when: false

- name: Deploy Node Exporter Full dashboard (id 1860) as a file
  ansible.builtin.copy:
    src: node-exporter-full-dashboard.json
    dest: "{{ grafana_deploy_dir }}/grafana/dashboards/node-exporter-full-dashboard.json"
    mode: "0644"
  # Picked up automatically by the file provisioner in dashboards.yml.j2
  # (updateIntervalSeconds: 30) — no container restart required.

- name: Show summary
  ansible.builtin.debug:
    msg:
      - "Deploy dir:  {{ grafana_deploy_dir }}"
      - "Admin user:  {{ grafana_user }}"
      - "Grafana:     http://localhost:3000"
      - "Prometheus:  http://localhost:9090 (internal)"
      - "Healthy:     {{ grafana_health is succeeded }}"
